name: Validación del sistema
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: intia-ci-fixture
          POSTGRES_DB: intia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:intia-ci-fixture@127.0.0.1:5432/intia_test
      AUTH_SECRET: ci-fixture-only-secret-with-at-least-thirty-two-characters
      NEXT_TELEMETRY_DISABLED: "1"
      PERFORMANCE_LOGS: "1"
      PERFORMANCE_ENVIRONMENT: local-staging
      PERFORMANCE_RELEASE: consistency-weekly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - name: Ensayar migración y restauración
        run: npm run db:ensayo
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workflow
      - run: npm run test:perfiles
      - name: Navegación y conservación del borrador ante conflicto
        run: npm run perf:local
        env:
          BENCH_SAMPLES: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: |
            .audit/migration-rehearsal.json
            .audit/workflow-smoke.json
            .audit/profiles-ui.json
            .audit/profiles-owner.png
            .audit/profiles-editor.png
            .audit/profiles-failure.png
            .audit/profiles-ui-server.log
            .audit/generation-progress.png
            .audit/gemini-3-8-selector.png
            .audit/navigation-report.json
            .audit/navigation-browser.jsonl
            .audit/edit-conflict.png
            .audit/navigation-failure.png
          retention-days: 7
